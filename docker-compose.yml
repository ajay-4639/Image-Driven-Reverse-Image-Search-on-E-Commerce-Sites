version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: image-search-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Image Search API
      - DEBUG=false
      - DEVICE=cpu
      - USE_IN_MEMORY=true
      - DATA_DIR=/app/data/fashion-images
      - UPLOAD_DIR=/app/uploads
      - IMAGEBIND_PATH=/app/ImageBind
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:80","http://frontend:80"]
    volumes:
      - ./data:/app/data:ro
      - uploads:/app/uploads
      - ./ImageBind:/app/ImageBind:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: image-search-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # Qdrant Vector Database (Optional - for persistent storage)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: image-search-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - app-network
    profiles:
      - with-qdrant

networks:
  app-network:
    driver: bridge

volumes:
  uploads:
  qdrant_storage:
